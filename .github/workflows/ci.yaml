name: Machine Learning CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mlflow-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install MLflow & Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn matplotlib seaborn

      # 4. Run MLflow Project (Re-training otomatis)
      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: "https://dagshub.com/alamahul/sistem-machine-learning-submission-dicoding.mlflow"
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject --env-manager=local

      # 5. Login ke Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build Docker Image Menggunakan MLflow
      - name: Build Docker Image via MLflow
        env:
          # WAJIB GANTI: Masukkan link DagsHub asli Anda di bawah ini agar bisa mengunduh model
          MLFLOW_TRACKING_URI: "https://dagshub.com/alamahul/sistem-machine-learning-submission-dicoding.mlflow" 
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow models build-docker -m "runs:/fda575f06478430d832f08c59071562f/model" -n "alamahulbayan/movie-genre-model:latest"

      # 7. Push Docker Image ke Docker Hub
      - name: Push Docker Image
        run: |
          docker push alamahulbayan/movie-genre-model:latest